name: Publish Entreprenuity Design Previews

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-design-previews.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-public-design-previews"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public showcase
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload reviewed static previews
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy public review site
        id: deployment
        uses: actions/deploy-pages@v4
